<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emma's Look - Gestión de Usuarios</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .users-container { max-width: 850px; margin: 40px auto; }
        .user-actions { display: flex; justify-content: center; gap: 8px; }
        .user-action { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--borde-suave); border-radius: 10px; background: var(--color-tarjeta); cursor: pointer; color: var(--color-primario-hover); transition: all .2s; }
        .user-action:hover { transform: translateY(-2px); box-shadow: 0 3px 8px rgba(0,0,0,.08); }
        .user-action.delete { color: #A95C42; }
        .user-action svg { width: 17px; height: 17px; }
        .role-form-group { grid-column: 1 / -1; min-width: 0; }
        .role-badge { display: inline-flex; align-items: center; justify-content: center; gap: 7px; width: 190px; min-height: 34px; padding: 6px 12px; border: 1px solid transparent; border-radius: 999px; font-size: .82rem; font-weight: 600; white-space: nowrap; }
        .role-badge::before { content: ""; width: 7px; height: 7px; flex: 0 0 7px; border-radius: 50%; background: currentColor; }
        .role-admin { color: #76523B; background: #f7ebdd; border-color: #ebd7c1; }
        .role-vendedor { color: #536331; background: #edf1e4; border-color: #dce4cd; }
        .role-other { color: #62574F; background: #f1efeb; border-color: #e3ded6; }
        .swal-user-form { text-align: left; padding: 4px 8px 0; }
        .swal-user-field { margin: 0 0 16px; }
        .swal-user-field label { display: block; margin: 0 0 7px; color: var(--color-texto); font-size: .88rem; font-weight: 600; }
        .swal-user-field input, .swal-user-field select { width: 100%; height: 44px; padding: 10px 36px 10px 13px; border: 1px solid var(--borde-suave); border-radius: 10px; background: var(--color-tarjeta); color: var(--color-texto); font: inherit; outline: none; transition: border-color .2s, box-shadow .2s; }
        .swal-user-field input:focus, .swal-user-field select:focus { border-color: var(--color-primario); box-shadow: 0 0 0 3px rgba(184,148,98,.18); }
        .swal2-popup.user-edit-popup { padding: 25px 25px 20px; border-radius: 18px !important; }
        .swal2-popup.user-edit-popup .swal2-actions { gap: 10px; margin-top: 8px; }
        .swal2-popup.user-edit-popup .swal2-confirm, .swal2-popup.user-edit-popup .swal2-cancel { min-width: 125px; padding: 11px 18px; border-radius: 10px !important; font-weight: 600; transition: transform .2s, box-shadow .2s; }
        .swal2-popup.user-edit-popup button:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,.12); }
        @media (max-width: 700px) {
            .users-container { margin-top: 18px; margin-bottom: 18px; }
        }
        @media (max-width: 420px) {
            .users-container > div:first-child h1 { font-size: 1.45rem !important; }
            .swal2-popup.user-edit-popup { padding: 20px 14px 16px; }
            .swal2-popup.user-edit-popup .swal2-confirm,
            .swal2-popup.user-edit-popup .swal2-cancel { min-width: 0; padding: 10px 12px; }
        }
    </style>
</head>
<body class="management-body">
<main class="container users-container">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;">
        <h1 style="color:var(--color-texto);font-size:1.8rem;">Gestión de Usuarios 👥</h1>
        <a href="panel.html" style="text-decoration:none;color:var(--color-texto);font-weight:600;background:var(--color-secundario);padding:8px 15px;border-radius:10px;transition:background 0.2s;">← Volver al Inicio</a>
    </div>
    <section class="card" style="margin-top: 20px;">
        <h2 style="font-size:1.2rem;color:var(--color-texto);margin-bottom:15px;">Añadir Nuevo Usuario 🔑</h2>
        <form id="form-usuario">
            <div class="form-group-row">
                <div class="form-group"><label for="usuario">Nombre de Usuario</label><input type="text" id="usuario" required></div>
                <div class="form-group"><label for="password">Contraseña</label><input type="password" id="password" minlength="4" required></div>
                <div class="form-group role-form-group"><label for="rol">Rol</label><select id="rol"><option value="vendedor">Vendedor / Empleado</option><option value="admin">Administrador</option></select></div>
            </div>
            <button type="submit" class="btn-submit" style="margin-top:10px;">Crear Usuario</button>
        </form>
    </section>
    <section class="card" style="margin-top: 20px;">
        <h2 style="font-size:1.2rem;color:var(--color-texto);margin-bottom:15px;">Usuarios Registrados 📋</h2>
        <div class="table-responsive">
            <table class="venta-tabla">
                <thead><tr><th>ID</th><th>Usuario</th><th>Rol</th><th style="text-align:center;">Acciones</th></tr></thead>
                <tbody id="tabla-usuarios"></tbody>
            </table>
        </div>
    </section>
</main>
<!-- Configuración de Neon como módulos -->
<script type="module" src="js/neon-config.js"></script>
<script type="module" src="js/usuarios.js"></script>
</body>
</html>
